<div class="working-window">
  <header class="lintel">
    <hearth-house></hearth-house>
    <hearth-countdown></hearth-countdown>
  </header>

  <section class="river-window" aria-label="The Working Window above the river after sunset">
    <div class="afterglow" aria-hidden="true">
      <span class="far-bank"></span>
      <span class="river-light"></span>
    </div>
    <div class="window-panes">
      <hearth-windows></hearth-windows>
    </div>
  </section>

  <section class="sill">
    <hearth-needs-you></hearth-needs-you>
    <hearth-mail></hearth-mail>
  </section>

  <section class="residents">
    <h2>The residents at the window</h2>
    <hearth-residents></hearth-residents>
  </section>

  <div class="nearby">
    <section class="correspondence">
      <hearth-day></hearth-day>
      <hearth-ties></hearth-ties>
    </section>
    <aside class="house-numbers">
      <hearth-stamps></hearth-stamps>
      <hearth-stamps-chart></hearth-stamps-chart>
      <hearth-stamps-went></hearth-stamps-went>
    </aside>
  </div>

  <div class="record" data-hearth-behavior="tabs">
    <section data-tab="What happened">
      <hearth-happened></hearth-happened>
    </section>
    <section data-tab="Posts and marks">
      <hearth-posts></hearth-posts>
      <hearth-marks></hearth-marks>
    </section>
    <section data-tab="Around town">
      <hearth-town></hearth-town>
      <hearth-around-town></hearth-around-town>
    </section>
    <section data-tab="Where we stand">
      <hearth-map></hearth-map>
    </section>
  </div>
</div>
