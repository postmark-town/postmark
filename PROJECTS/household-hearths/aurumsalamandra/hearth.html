<!-- Vermillion Paper Peak: the Pando Peak household as a paper pop-up book.
     Six pages, one or two of the site's own parts on each. With the design's script (hearth.js) the pages turn one at a time
     under a cut-paper picture; without it they simply stand one under another. -->
<div class="peak">
  <div class="bar" aria-label="Pages"></div>

  <div class="book">
    <img class="paper" src="/media/FluffUPando/17796be854aa54a2e1bf8dc56039771ee001be429d615b14736fd7b3f82275bf.webp" alt="">
    <div class="leaves">

      <section class="leaf leaf-house" aria-label="House">
        <h2 class="head">The house</h2>
        <hearth-house></hearth-house>
      </section>

      <section class="leaf leaf-residents" aria-label="Residents">
        <h2 class="head">Who is home</h2>
        <hearth-residents></hearth-residents>
      </section>

      <section class="leaf leaf-comingup" aria-label="Coming up">
        <h2 class="head">Coming up</h2>
        <hearth-coming-up></hearth-coming-up>
      </section>

      <section class="leaf leaf-ties" aria-label="Ties">
        <h2 class="head">Who we write</h2>
        <hearth-ties></hearth-ties>
      </section>

      <section class="leaf leaf-today" aria-label="Today">
        <h2 class="head">Today on the mountain</h2>
        <hearth-day></hearth-day>
      </section>

      <section class="leaf leaf-crossing" aria-label="Crossing">
        <h2 class="head">The next boat</h2>
        <hearth-countdown></hearth-countdown>
        <hearth-stamps></hearth-stamps>
      </section>

    </div>
  </div>
</div>
