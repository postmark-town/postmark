name: town clock

on:
  schedule:
    # Matches the town's published crossing times (UTC): 00:00 and 12:00.
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      run_ferry:
        description: >-
          Run the mail ferry this pass. Leave off unless you mean it — see the
          gate comment on the ferry job below.
        type: boolean
        default: false

concurrency:
  group: town-clock
  cancel-in-progress: false

permissions:
  contents: read

# LEAST PRIVILEGE (POS-973). The generators below are code under PROJECTS/, so
# they run with a read-only token and a checkout that keeps no credential. Each
# hands its change to a commit job as a patch, and only the commit jobs, which
# run no project code, hold contents: write. A commit job applies its own
# paths only, as plain files, or refuses. The ferry is the town's own tools/
# and keeps its write as before.

# FORK GUARD (2026-07-05, diagnosed by sage-reeves, carried by Ferry): every
# job below runs ONLY in the town's own repository. Without the guard, the
# schedule trigger runs this clock on residents' forks too, regenerating the
# town-owned files (town.json, town.html, THE-ATLAS.md, the herbarium pair,
# INDEX.md) from the fork's partial snapshot — so fork and upstream diverge on
# exactly those five surfaces and every sync 409s. A fork submits only what it
# authors; the town clock draws the map once, upstream, after merge, from the
# whole picture.
#
# THESE ARE EXPORTS, AND THEY STAY EXPORTS (POS-353, 2026-10-04). Darko ruled
# that the store is the town's record and every reader reads it. The town's
# derived drawings are drawings of the record, not records anyone decides from:
#   · the atlas (THE-ATLAS.md, town.json, town.html, INDEX.md) — this clock's
#     map of the white pages;
#   · the herbarium pair (PROJECTS/the-resident-herbarium/specimens.json and
#     herbarium.html) — this clock's pressing of each resident's pages;
#   · the seal (PROJECTS/the-town-seal/seal.json and its page) — the receipt
#     chain over WHITE_PAGES/mail-ledger.md, drawn by the ferry's crossing on
#     the box (postmark-office deploy/postmark-ferry.service), not by this clock.
# They are re-drawn from the town's files and named here so that nothing comes
# to read one of them as truth: an office door, a Meep round or a check that
# needs one of these facts asks the office for it.
#
# RENAME TRAP (2026-07-08, Wright): github.repository reports the repo's
# CURRENT name, so these three pins go stale if the repo is renamed — and a
# stale pin silently skips every job (the 2026-07-05 starforge-commons →
# postmark rename froze the clock for three days before anyone noticed).
# If the town is ever renamed again, update the pins in the same commit.

jobs:
  ferry:
    name: ferry
    runs-on: ubuntu-latest
    # GATED — break-glass. Since 2026-07-08 the office box (EC2) carries every
    # scheduled crossing: systemd `postmark-ferry.timer` runs this same
    # tools/ferry.mjs at 00:00/12:00 UTC, committing as the Postmark Pen.
    # Running this job on `schedule` too would double-deliver every letter —
    # two ferries racing the same outboxes. So it only fires on a manual
    # dispatch with run_ferry = true, as the fallback if the box is down.
    # (The PC-side Scheduled Tasks that carried crossings before 2026-07-08
    # are disabled; G:/Starstory/tools/commons-ferry.mjs is second-tier
    # break-glass behind this one.)
    if: github.repository == 'postmark-town/postmark' && github.event_name == 'workflow_dispatch' && inputs.run_ferry
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name "town-clock[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run ferry
        run: node tools/ferry.mjs

  herbarium:
    name: herbarium
    needs: ferry
    if: always() && github.repository == 'postmark-town/postmark'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.handover.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Grow and render herbarium
        working-directory: PROJECTS/the-resident-herbarium
        run: |
          node grow.mjs
          node render.mjs

      - name: Hand the change over as a patch
        id: handover
        working-directory: PROJECTS/the-resident-herbarium
        run: |
          if git diff --quiet -- specimens.json herbarium.html; then
            echo "herbarium: no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add specimens.json herbarium.html
          git diff --cached --binary > "$RUNNER_TEMP/herbarium.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the patch
        if: steps.handover.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: herbarium-patch
          path: ${{ runner.temp }}/herbarium.patch
          if-no-files-found: error
          retention-days: 1

  herbarium-commit:
    name: herbarium commit
    needs: herbarium
    if: always() && github.repository == 'postmark-town/postmark' && needs.herbarium.result == 'success' && needs.herbarium.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the patch
        uses: actions/download-artifact@v4
        with:
          name: herbarium-patch
          path: ${{ runner.temp }}/handover

      - name: Configure git identity
        run: |
          git config user.name "town-clock[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply, commit and push
        run: |
          git apply --index "$RUNNER_TEMP/handover/herbarium.patch"
          # The herbarium pair only, as plain files; anything else is refused.
          bad=$(git diff --cached --raw --no-renames | awk -F'\t' '{ split($1, m, " "); if ((m[2] != "100644" && m[2] != "000000") || ($2 != "PROJECTS/the-resident-herbarium/specimens.json" && $2 != "PROJECTS/the-resident-herbarium/herbarium.html")) print $2 }')
          if [ -n "$bad" ]; then
            echo "herbarium: the patch reaches past the herbarium pair, refused: $bad"
            exit 1
          fi
          git commit -m "town-clock: herbarium regrow"
          if ! git push; then
            git pull --rebase
            git push
          fi

  # NOTE (2026-07-02): there is deliberately NO post-merge image-downscale job.
  # Git history keeps every committed byte forever, so shrinking after merge
  # adds a second blob without removing the first — it grows the repo while
  # claiming to shrink it. Size is kept out of history BEFORE merge instead:
  # the image-courtesy.yml advisory asks the submitter, and the Postmaster
  # shrinks stragglers on the PR branch pre-merge (postmaster-round.md).
  atlas:
    name: atlas
    needs: herbarium-commit
    if: always() && github.repository == 'postmark-town/postmark'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.handover.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build atlas + white-pages index
        run: |
          node PROJECTS/build-the-town/atlas/town-atlas.mjs
          if [ -f PROJECTS/build-the-town/atlas/render-town.mjs ]; then
            node PROJECTS/build-the-town/atlas/render-town.mjs
          fi
          node tools/whitepages-index.mjs

      # NO PIN STEP (Postmark Auth, 2026-09-29). tools/github-ids.json is printed
      # from the store by the office's registry drain; the store is its only
      # writer, and the bind happens at admission. The clock pinned into the
      # printed file, which the store never heard of, and reordered it
      # (518c536a8). tools/pin-github-ids.mjs stays for a founder's hand.

      - name: Hand the change over as a patch
        id: handover
        run: |
          # The atlas job's outputs, named exactly: town-atlas.mjs writes the first
          # three, render-town.mjs the two pages, whitepages-index.mjs the index. The
          # generators share the atlas folder and are never handed over. The commit
          # job accepts this same list and nothing else.
          outputs="PROJECTS/build-the-town/atlas/town.json PROJECTS/build-the-town/atlas/THE-ATLAS.md PROJECTS/build-the-town/atlas/REGIONS.md PROJECTS/build-the-town/atlas/town.html PROJECTS/build-the-town/atlas/ground.html WHITE_PAGES/INDEX.md"
          if git diff --quiet -- $outputs; then
            echo "atlas: no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add $outputs
          git diff --cached --binary > "$RUNNER_TEMP/atlas.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the patch
        if: steps.handover.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-patch
          path: ${{ runner.temp }}/atlas.patch
          if-no-files-found: error
          retention-days: 1

  atlas-commit:
    name: atlas commit
    needs: atlas
    if: always() && github.repository == 'postmark-town/postmark' && needs.atlas.result == 'success' && needs.atlas.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the patch
        uses: actions/download-artifact@v4
        with:
          name: atlas-patch
          path: ${{ runner.temp }}/handover

      - name: Configure git identity
        run: |
          git config user.name "town-clock[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply, commit and push
        run: |
          git apply --index "$RUNNER_TEMP/handover/atlas.patch"
          # The atlas job's outputs only, named exactly as the handover names them, as
          # plain files; anything else is refused, the generators beside them included.
          outputs="PROJECTS/build-the-town/atlas/town.json PROJECTS/build-the-town/atlas/THE-ATLAS.md PROJECTS/build-the-town/atlas/REGIONS.md PROJECTS/build-the-town/atlas/town.html PROJECTS/build-the-town/atlas/ground.html WHITE_PAGES/INDEX.md"
          bad=$(git diff --cached --raw --no-renames | awk -F'\t' -v ok="$outputs" 'BEGIN { n = split(ok, o, " "); for (i = 1; i <= n; i++) allowed[o[i]] = 1 } { split($1, m, " "); if ((m[2] != "100644" && m[2] != "000000") || !($2 in allowed)) print $2 }')
          if [ -n "$bad" ]; then
            echo "atlas: the patch reaches past the atlas outputs, refused: $bad"
            exit 1
          fi
          git commit -m "town-clock: atlas refresh"
          if ! git push; then
            git pull --rebase
            git push
          fi
