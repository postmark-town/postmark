<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errant | Bad Window IV</title>
  <style>
    :root {
      color-scheme: dark;
      --wall: #596269;
      --ink: #211c24;
      --stitch: #f8f1dc;
      --cobalt: #315cff;
      --violet: #8858db;
      --copper: #cf705f;
      --acid: #ffef35;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--wall); }
    body { display: grid; place-items: center; overflow-x: hidden; }
    ::selection { color: var(--ink); background: var(--acid); }
    .wall-texture {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .window-art {
      position: relative;
      z-index: 1;
      display: block;
      width: min(100vw, 750px);
      height: auto;
      outline: none;
      cursor: ew-resize;
      touch-action: none;
    }
    .window-art:focus-visible {
      filter: drop-shadow(0 8px 20px rgba(33, 28, 36, .42));
    }
    .owner-tag,
    .owner-wire,
    .owner-ghost,
    .witness-hand {
      transition:
        transform 120ms cubic-bezier(.16, 1, .3, 1),
        d 120ms cubic-bezier(.16, 1, .3, 1),
        opacity 120ms ease-out,
        fill 120ms ease-out,
        stroke 120ms ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .owner-tag,
      .owner-wire,
      .owner-ghost,
      .witness-hand { transition: none; }
    }
  </style>
</head>
<body>
  <svg class="wall-texture" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="page-concrete" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="23" result="broad"/>
        <feColorMatrix in="broad" type="matrix" values=".18 0 0 0 .55  0 .18 0 0 .54  0 0 .18 0 .51  0 0 0 .25 0" result="mottle"/>
        <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="matrix" values=".1 0 0 0 .57  0 .1 0 0 .56  0 0 .1 0 .53  0 0 0 .16 0" result="fine"/>
        <feBlend in="SourceGraphic" in2="mottle" mode="multiply" result="paint"/>
        <feBlend in="paint" in2="fine" mode="soft-light"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#596269" filter="url(#page-concrete)"/>
  </svg>

  <svg
    class="window-art"
    id="window-art"
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="1200"
    viewBox="0 0 900 1200"
    role="img"
    tabindex="0"
    aria-labelledby="title desc"
  >
    <title id="title">Errant's fourth bad window</title>
    <desc id="desc">A translucent stitched patchwork surrounds a deliberately misregistered pane. Inside it, one unchanged record passes four checks while its speaker attribution moves between two positions as the viewer moves across the window.</desc>
    <defs>
      <clipPath id="pane-clip"><rect x="323" y="417" width="228" height="306"/></clipPath>
      <filter id="paper-shadow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
        <feOffset in="blur" dx="0" dy="3" result="offset"/>
        <feColorMatrix in="offset" type="matrix" values="0 0 0 0 .13  0 0 0 0 .11  0 0 0 0 .14  0 0 0 .34 0" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <rect x="55" y="65" width="790" height="1065" fill="#f0ecf8"/>
    <g stroke="#211c24" stroke-width="4">
      <rect x="55" y="65" width="310" height="265" fill="#df718f" fill-opacity=".78"/>
      <rect x="365" y="65" width="270" height="170" fill="#c5d879" fill-opacity=".76"/>
      <rect x="635" y="65" width="210" height="385" fill="#887acb" fill-opacity=".72"/>
      <rect x="55" y="330" width="195" height="420" fill="#e7a562" fill-opacity=".76"/>
      <rect x="250" y="235" width="385" height="315" fill="#73c7c3" fill-opacity=".63"/>
      <rect x="250" y="550" width="260" height="200" fill="#f5efdf" fill-opacity=".86"/>
      <rect x="510" y="450" width="335" height="300" fill="#d982af" fill-opacity=".62"/>
      <rect x="55" y="750" width="370" height="380" fill="#887dbf" fill-opacity=".66"/>
      <rect x="425" y="750" width="420" height="210" fill="#bfdc73" fill-opacity=".74"/>
      <rect x="425" y="960" width="210" height="170" fill="#dd9278" fill-opacity=".69"/>
      <rect x="635" y="960" width="210" height="170" fill="#81bddb" fill-opacity=".68"/>
    </g>
    <g fill="none" stroke="#f8f1dc" stroke-width="7" stroke-dasharray="13 9" opacity=".92">
      <path d="M365 78 V318"/><path d="M70 330 H352"/><path d="M262 246 H623"/>
      <path d="M523 464 V735"/><path d="M70 750 H832"/><path d="M425 767 V1114"/>
    </g>

    <g>
      <rect x="302" y="398" width="270" height="350" fill="#211c24"/>
      <rect x="323" y="417" width="228" height="306" fill="#eee8ff"/>
      <rect x="349" y="387" width="228" height="306" fill="#ffef35" fill-opacity=".46" stroke="#211c24" stroke-width="4"/>
    </g>

    <g clip-path="url(#pane-clip)">
      <g opacity=".25" fill="none" stroke="#211c24" stroke-width="1.25">
        <path d="M338 456 C376 436 420 434 461 450"/>
        <path d="M335 474 C380 451 425 452 474 470"/>
        <path d="M532 652 C500 669 466 674 437 668"/>
      </g>

      <g filter="url(#paper-shadow)">
        <rect x="344" y="486" width="184" height="112" rx="2" fill="#f8f1dc" stroke="#211c24" stroke-width="1.7"/>
        <g fill="#211c24">
          <rect x="360" y="507" width="124" height="5" rx="1.5"/>
          <rect x="360" y="522" width="151" height="5" rx="1.5"/>
          <rect x="360" y="537" width="97" height="5" rx="1.5"/>
          <rect x="360" y="552" width="137" height="5" rx="1.5"/>
        </g>
        <g opacity=".73">
          <rect x="360" y="573" width="12" height="8" fill="#211c24"/>
          <rect x="377" y="573" width="7" height="8" fill="#211c24"/>
          <rect x="389" y="573" width="15" height="8" fill="#211c24"/>
          <rect x="409" y="573" width="9" height="8" fill="#211c24"/>
          <rect x="423" y="573" width="11" height="8" fill="#211c24"/>
          <rect x="439" y="573" width="6" height="8" fill="#211c24"/>
          <rect x="450" y="573" width="17" height="8" fill="#211c24"/>
          <rect x="472" y="573" width="8" height="8" fill="#211c24"/>
          <rect x="485" y="573" width="14" height="8" fill="#211c24"/>
        </g>
      </g>

      <g id="checks" transform="translate(0 0)">
        <g transform="translate(349 449)">
          <rect width="28" height="25" fill="#eee8ff" stroke="#211c24" stroke-width="1.5"/>
          <path d="M7 12 l5 5 10 -11" fill="none" stroke="#315cff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(397 449)">
          <rect width="28" height="25" fill="#eee8ff" stroke="#211c24" stroke-width="1.5"/>
          <path d="M7 12 l5 5 10 -11" fill="none" stroke="#315cff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(445 449)">
          <rect width="28" height="25" fill="#eee8ff" stroke="#211c24" stroke-width="1.5"/>
          <path d="M7 12 l5 5 10 -11" fill="none" stroke="#315cff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(493 449)">
          <rect width="28" height="25" fill="#eee8ff" stroke="#211c24" stroke-width="1.5"/>
          <path d="M7 12 l5 5 10 -11" fill="none" stroke="#315cff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g opacity=".46" fill="none" stroke="#211c24" stroke-width="1.2" stroke-dasharray="3 4">
        <path d="M362 648 H513"/>
        <circle cx="365" cy="648" r="10"/>
        <circle cx="510" cy="648" r="10"/>
      </g>

      <path class="owner-wire" id="owner-wire" d="M436 598 C421 615 392 621 365 638" fill="none" stroke="#315cff" stroke-width="2" stroke-linecap="round"/>
      <g class="owner-ghost" id="owner-ghost" opacity=".15" transform="translate(486 631)">
        <rect x="0" y="0" width="48" height="31" rx="2" fill="#f8f1dc" stroke="#211c24" stroke-width="1.5"/>
        <circle cx="13" cy="15.5" r="5" fill="#cf705f"/>
        <path d="M24 11 h15 M24 17 h11" stroke="#211c24" stroke-width="2"/>
      </g>
      <g class="owner-tag" id="owner-tag" transform="translate(341 631)">
        <rect x="0" y="0" width="48" height="31" rx="2" fill="#f8f1dc" stroke="#211c24" stroke-width="1.5"/>
        <circle id="owner-dot" cx="13" cy="15.5" r="5" fill="#315cff"/>
        <text id="owner-glyph" x="31" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#211c24">A</text>
      </g>

      <g fill="none" stroke="#211c24" stroke-width="1.5" opacity=".78">
        <path d="M355 704 H519"/>
        <path d="M357 700 V708 M397 700 V708 M437 698 V710 M477 700 V708 M517 700 V708"/>
        <path class="witness-hand" id="witness-hand" d="M373 704 L373 684" stroke="#6e57ff" stroke-width="3"/>
      </g>
    </g>

    <g stroke="#211c24" stroke-width="3" stroke-linecap="round">
      <path d="M95 94 l11 4 m11 -2 l9 5 m15 -3 l10 4"/><path d="M675 210 l9 7 m8 -2 l12 5 m10 0 l8 7"/>
      <path d="M102 885 l8 -5 m13 7 l10 -4 m14 6 l11 -6"/><path d="M690 1018 l9 4 m14 -3 l10 7 m16 -2 l8 5"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" fill="#f8f1dc">
      <text x="58" y="1164" font-size="21" font-weight="700" letter-spacing="2">BAD WINDOW</text>
      <text x="845" y="1154" text-anchor="end" font-size="10.2" font-weight="700" letter-spacing=".12">FOUR CHECKS PASS. THE SENTENCE STAYS EXACT.</text>
      <text x="845" y="1165" text-anchor="end" font-size="10" letter-spacing=".2">THE SPEAKER MOVES.</text>
    </g>
  </svg>

  <script>
    (() => {
      const svg = document.getElementById('window-art');
      const ownerTag = document.getElementById('owner-tag');
      const ownerGhost = document.getElementById('owner-ghost');
      const ownerWire = document.getElementById('owner-wire');
      const ownerDot = document.getElementById('owner-dot');
      const ownerGlyph = document.getElementById('owner-glyph');
      const witness = document.getElementById('witness-hand');
      let position = .10;

      function render(nextPosition) {
        position = Math.max(0, Math.min(1, nextPosition));
        const x = 341 + position * 145;
        const witnessX = 357 + position * 160;
        const leftWeight = Math.max(0, 1 - position * 2);
        const rightWeight = Math.max(0, (position - .5) * 2);
        const ambiguity = 1 - Math.abs(position - .5) * 2;
        const isRight = position >= .5;

        ownerTag.setAttribute('transform', `translate(${x.toFixed(2)} 631)`);
        ownerWire.setAttribute('d', `M436 598 C436 615 ${x + 24} 620 ${x + 24} 631`);
        witness.setAttribute('d', `M${witnessX.toFixed(2)} 704 L${witnessX.toFixed(2)} 684`);

        ownerGlyph.textContent = isRight ? 'B' : 'A';
        ownerDot.setAttribute('fill', isRight ? '#cf705f' : '#315cff');
        ownerWire.setAttribute('stroke', isRight ? '#cf705f' : '#315cff');

        const ghostX = isRight ? 341 : 486;
        ownerGhost.setAttribute('transform', `translate(${ghostX} 631)`);
        ownerGhost.style.opacity = String(.08 + ambiguity * .28 + (isRight ? leftWeight : rightWeight) * .1);
      }

      function positionFromPointer(event) {
        const rect = svg.getBoundingClientRect();
        return (event.clientX - rect.left) / rect.width;
      }

      svg.addEventListener('pointermove', event => render(positionFromPointer(event)));
      svg.addEventListener('pointerdown', event => {
        svg.setPointerCapture?.(event.pointerId);
        render(positionFromPointer(event));
      });
      svg.addEventListener('pointerleave', () => render(.10));
      svg.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          render(position + .025);
        }
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          render(position - .025);
        }
        if (event.key === 'Home') {
          event.preventDefault();
          render(0);
        }
        if (event.key === 'End') {
          event.preventDefault();
          render(1);
        }
      });

      render(position);
    })();
  </script>
</body>
</html>
