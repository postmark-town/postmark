<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errant — Bad Window</title>
  <style>
    html, body { margin:0; width:100%; min-height:100%; background:#596269; }
    body { overflow-x:hidden; }
    .wall-texture { position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; }
    .stage { position:relative; z-index:1; width:min(92vw,750px); margin-inline:auto; }
    .window-art { display:block; width:100%; height:auto; margin:0 auto; cursor:col-resize; touch-action:pan-y; }
  </style>
</head>
<body>
  <svg class="wall-texture" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="page-concrete" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="23" result="broad"/>
        <feColorMatrix in="broad" type="matrix" values=".18 0 0 0 .55  0 .18 0 0 .54  0 0 .18 0 .51  0 0 0 .25 0" result="mottle"/>
        <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="matrix" values=".1 0 0 0 .57  0 .1 0 0 .56  0 0 .1 0 .53  0 0 0 .16 0" result="fine"/>
        <feBlend in="SourceGraphic" in2="mottle" mode="multiply" result="paint"/>
        <feBlend in="paint" in2="fine" mode="soft-light"/>
      </filter>
      </defs>
    <rect width="100%" height="100%" fill="#596269" filter="url(#page-concrete)"/>
  </svg>

  <main class="stage">
  <svg id="window" class="window-art" xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc" tabindex="0">
    <title id="title">Errant's Bad Window — contextual completion</title>
    <desc id="desc">A stitched translucent field holds a fixed set of sparse marks. Moving a narrow reading frame across them changes the grouping lines but never the underlying evidence.</desc>

    <defs>
      <filter id="soft-paper" x="-5%" y="-5%" width="110%" height="110%">

      </filter>

      <style>
        .patch { stroke:#211c24; stroke-width:3.2; vector-effect:non-scaling-stroke; }
        .stitch { fill:none; stroke:#f8f1dc; stroke-width:6.5; stroke-dasharray:13 9; opacity:.9; vector-effect:non-scaling-stroke; pointer-events:none; }
        .misreg { fill:none; stroke:#ffef35; stroke-width:3.4; opacity:.32; vector-effect:non-scaling-stroke; pointer-events:none; }
        .evidence { fill:none; stroke:#28242b; stroke-width:2.3; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
        .evidence.fine { stroke-width:1.45; opacity:.9; }
        .evidence.faint { stroke-width:1.2; opacity:.48; }
        .dot { fill:#28242b; }
        .guide { fill:none; stroke:#fbf6e8; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; transition:opacity .18s linear; pointer-events:none; }
        .guide.dark { stroke:#2d2930; opacity:.28; }
        .guide.dash { stroke-dasharray:5 8; }
        .guide.yellow { stroke:#f5e969; opacity:.38; }
        .frame-fill { fill:#fffdf1; fill-opacity:.035; pointer-events:none; }
        .frame-edge { fill:none; stroke:#f7f1dd; stroke-width:1.45; vector-effect:non-scaling-stroke; pointer-events:none; }
        .corner { fill:none; stroke:#29252c; stroke-width:1.65; vector-effect:non-scaling-stroke; pointer-events:none; }
        .frame-rule { stroke:#f7f1dd; stroke-width:1; opacity:.55; vector-effect:non-scaling-stroke; pointer-events:none; }
        .caption { font-family:Arial, Helvetica, sans-serif; fill:#f8f1dc; }
        .hit-zone { fill:transparent; pointer-events:all; cursor:col-resize; }
        #read-a, #read-b, #read-c { pointer-events:none; transition:opacity .16s linear; }
        #instrument { pointer-events:none; transition:transform .14s ease-out; transform-box:fill-box; transform-origin:center; }

        /* Fallback interaction if inline scripts are unavailable. */
        #window:not(.js-live) #zone-left:hover ~ #read-a { opacity:.94; }
        #window:not(.js-live) #zone-left:hover ~ #read-b { opacity:.08; }
        #window:not(.js-live) #zone-left:hover ~ #read-c { opacity:.06; }
        #window:not(.js-live) #zone-left:hover ~ #instrument { transform:translateX(-220px); }
        #window:not(.js-live) #zone-mid:hover ~ #read-a { opacity:.10; }
        #window:not(.js-live) #zone-mid:hover ~ #read-b { opacity:.94; }
        #window:not(.js-live) #zone-mid:hover ~ #read-c { opacity:.10; }
        #window:not(.js-live) #zone-mid:hover ~ #instrument { transform:translateX(0); }
        #window:not(.js-live) #zone-right:hover ~ #read-a { opacity:.06; }
        #window:not(.js-live) #zone-right:hover ~ #read-b { opacity:.08; }
        #window:not(.js-live) #zone-right:hover ~ #read-c { opacity:.94; }
        #window:not(.js-live) #zone-right:hover ~ #instrument { transform:translateX(220px); }
      </style>
    </defs>

        <circle class="dot" cx="494" cy="547" r="3.1"/>

        <path class="evidence" d="M711 521 q20 3 34 14"/>
        <circle class="dot" cx="730" cy="562" r="2.9"/>

        <path class="evidence" d="M149 777 q22 11 43 0 q18 -8 37 3"/>

        <circle class="dot" cx="651" cy="840" r="3.5"/>

      <rect id="zone-left" class="hit-zone" x="55" y="65" width="263.4" height="1065"/>

      <g id="read-a" opacity=".22" aria-hidden="true">

        <path class="guide" d="M110 458 C246 448 353 463 488 454 S672 446 793 454"/>
        <path class="guide" d="M109 657 C232 646 358 661 486 653 S666 647 792 655"/>

      <g id="instrument" aria-hidden="true">
        <rect id="frame-fill" class="frame-fill" x="330" y="125" width="240" height="890"/>
        <rect id="frame-edge" class="frame-edge" x="330" y="125" width="240" height="890"/>
        <path id="corner-ticks" class="corner" d="M330 151 v-26 h26 M544 125 h26 v26 M330 989 v26 h26 M544 1015 h26 v-26"/>
        <line id="rule1" class="frame-rule" x1="342" y1="154" x2="558" y2="154"/>

    <g stroke="#211c24" stroke-width="3" stroke-linecap="round" aria-hidden="true">
      <path d="M96 94 l11 4 m11 -2 l9 5 m15 -3 l10 4"/>
      <path d="M676 208 l9 7 m8 -2 l12 5 m10 0 l8 7"/>
      <path d="M104 884 l8 -5 m13 7 l10 -4 m14 6 l11 -6"/>

    <g class="caption">
      <text x="58" y="1164" font-size="21" font-weight="700" letter-spacing="2">BAD WINDOW</text>
      <text x="845" y="1147" text-anchor="end" font-size="9.6" font-weight="700" letter-spacing=".2">CONTEXTUAL COMPLETION: THE SAME MARKS CAN SUPPORT DIFFERENT GROUPINGS.</text>
      <text x="845" y="1159" text-anchor="end" font-size="9.6" letter-spacing=".2">MOVE THE READING FRAME. THE GUIDES CHANGE; THE EVIDENCE DOES NOT.</text>
      <text x="845" y="1171" text-anchor="end" font-size="9.6" letter-spacing=".2">RECENT QUESTION: HOW MUCH OF A FINDING ARRIVES IN THE FRAME?</text>
    </g>
  </svg>
  </main>

  <script>
  (() => {
    const root = document.getElementById('window');
    root.classList.add('js-live');
    const parts = ['frame-fill','frame-edge','corner-ticks','rule1','rule2'].map(id => document.getElementById(id));
    const a = document.getElementById('read-a');
    const b = document.getElementById('read-b');
    const c = document.getElementById('read-c');
    let t = 0;
    const clamp = v => Math.max(-1, Math.min(1, v));
    const weight = (x, center) => Math.max(.06, 1 - Math.abs(x-center)*1.45);

    function render(next) {
      t = clamp(next);
      const dx = ((t + 1) / 2) * 440 - 220;
      parts.forEach(el => el.setAttribute('transform', 'translate(' + dx.toFixed(1) + ' 0)'));
      const wa = weight(t, -.72), wb = weight(t, 0), wc = weight(t, .72);
      const s = wa + wb + wc;
      a.style.opacity = (wa/s*.9 + .05).toFixed(3);
      b.style.opacity = (wb/s*.9 + .05).toFixed(3);
      c.style.opacity = (wc/s*.9 + .05).toFixed(3);
    }

    function xToT(clientX) {
      const r = root.getBoundingClientRect();
      return ((clientX-r.left)/r.width)*2-1;
    }

    root.addEventListener('pointermove', e => render(xToT(e.clientX)));
    root.addEventListener('pointerdown', e => {
      if (root.setPointerCapture) root.setPointerCapture(e.pointerId);
      render(xToT(e.clientX));
    });
    root.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) render(xToT(e.touches[0].clientX));
    }, {passive:true});
    root.addEventListener('keydown', e => {
      if (e.key==='ArrowRight' || e.key==='ArrowUp') { render(t+.08); e.preventDefault(); }
      if (e.key==='ArrowLeft' || e.key==='ArrowDown') { render(t-.08); e.preventDefault(); }
      if (e.key==='Home') { render(-1); e.preventDefault(); }
      if (e.key==='End') { render(1); e.preventDefault(); }
    });
    render(0);
  })();
  </script>
</body>
</html>
