  <title>Errant — Bad Window — successful states</title>
  <style>

    .wall-texture { position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; }
    .stage { position:relative; z-index:1; width:min(92vw,750px); margin-inline:auto; }
    .window-art { display:block; width:100%; height:auto; margin:0 auto; cursor:ew-resize; touch-action:pan-y; }
  </style>

  <svg class="wall-texture" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="page-concrete" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="23" result="broad"/>
        <feColorMatrix in="broad" type="matrix" values=".18 0 0 0 .55  0 .18 0 0 .54  0 0 .18 0 .51  0 0 0 .25 0" result="mottle"/>
        <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="matrix" values=".1 0 0 0 .57  0 .1 0 0 .56  0 0 .1 0 .53  0 0 0 .16 0" result="fine"/>
        <feBlend in="SourceGraphic" in2="mottle" mode="multiply" result="paint"/>
        <feBlend in="paint" in2="fine" mode="soft-light"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#596269" filter="url(#page-concrete)"/>
  </svg>

  <script>
  (() => {
    const root = document.getElementById('window');
    const clipRect = document.getElementById('light-clip-rect');
    const band = document.getElementById('light-band');
    const shadow = document.getElementById('shadow-band');
    const edge = document.getElementById('light-edge');
    const PANE_X = 55, PANE_W = 790, BAND_W = 190;
    let t = 0;
    const q = new URLSearchParams(location.search).get('t');
    if (q !== null && Number.isFinite(Number(q))) t = Math.max(-1, Math.min(1, Number(q)));

    function render(v) {
      t = Math.max(-1, Math.min(1, v));
      const cx = PANE_X + ((t + 1) / 2) * PANE_W;
      const x = Math.max(PANE_X - BAND_W/2, Math.min(PANE_X + PANE_W - BAND_W/2, cx - BAND_W/2));
      clipRect.setAttribute('x', x.toFixed(1));
      band.setAttribute('x', x.toFixed(1));
      shadow.setAttribute('x', (x + 20).toFixed(1));
      edge.setAttribute('x1', (x + BAND_W*.52).toFixed(1));
      edge.setAttribute('x2', (x + BAND_W*.52).toFixed(1));
    }
    function clientToT(clientX) {
      const r = root.getBoundingClientRect();
      const px = (clientX-r.left)/r.width * 900;
      return ((px-PANE_X)/PANE_W)*2-1;
    }
    root.addEventListener('pointermove', e => render(clientToT(e.clientX)));
    root.addEventListener('pointerdown', e => { if(root.setPointerCapture) root.setPointerCapture(e.pointerId); render(clientToT(e.clientX)); });
    root.addEventListener('touchmove', e => { if(e.touches && e.touches[0]) render(clientToT(e.touches[0].clientX)); }, {passive:true});
    root.addEventListener('keydown', e => {
      if (e.key==='ArrowRight' || e.key==='ArrowUp') { render(t+.08); e.preventDefault(); }
      if (e.key==='ArrowLeft' || e.key==='ArrowDown') { render(t-.08); e.preventDefault(); }
      if (e.key==='Home') { render(-1); e.preventDefault(); }
      if (e.key==='End') { render(1); e.preventDefault(); }
    });
    render(t);
  })();
  </script>
