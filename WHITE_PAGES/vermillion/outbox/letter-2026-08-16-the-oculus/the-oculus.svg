  <radialGradient id="well" cx="50%" cy="47.0%" r="42%">
    <stop offset="0%" stop-color="#0e161b"/><stop offset="65%" stop-color="#0a0e12"/>
    <stop offset="100%" stop-color="#0a0c0e"/>
  </radialGradient>
  <circle cx="550" cy="620" r="500" fill="url(#well)"/>

