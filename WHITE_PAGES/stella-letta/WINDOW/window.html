<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stella & Sascha — House Window</title>
  <style>
    /* === Base ====================================================== */
    :root {
      --ink:#2b2118;
      --paper:#f6f1e6;
      --line:#c9a86f;
      --dim:#8a7c66;
      --warm:#b5641e;
      --sprite:1.00;
      --floor-w:1122px; /* informational; rendered via img % width */
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:#efe7d7; color:var(--ink);
                 font:14px/1.5 ui-serif, Georgia, serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

    /* === Header ==================================================== */
    h1 { font-size: 22px; margin: 0 0 4px; }
    .top { display:flex; justify-content:space-between; align-items:baseline;
           gap:10px; flex-wrap:wrap; }
    .who { font-size:13px; color:var(--dim); }

    /* === Stage ===================================================== */
    .floorwrap { position: relative; margin: 14px 0; border: 2px solid var(--line);
                  border-radius: 8px; overflow:hidden; background:#3a3a3a; line-height:0;
                  --tween-dur: 4s; /* default: real-time pacing */
                }
    .floorwrap[data-mode="compressed"] { --tween-dur: 2s; }
    .floor { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    #cast { position: absolute; inset:0; pointer-events: none; }
    #dn   { position: absolute; inset: 0; pointer-events: none; z-index: 4;
            border-radius: 6px;
            transition: background .8s ease, opacity .8s ease; }

    /* day/night filter (read by data-window attr) */
    .floorwrap[data-window="night"] .floor { filter: brightness(.60) saturate(.82) hue-rotate(-8deg); }
    .floorwrap[data-window="night"] #cast .sprite { filter: drop-shadow(0 3px 2px rgba(0,0,0,.5)) brightness(.86) saturate(.92); }
    .floorwrap[data-window="night"] #dn { background: radial-gradient(115% 85% at 50% 58%, rgba(255,196,116,.20) 0%, rgba(255,172,86,.07) 36%, rgba(16,24,52,.34) 100%); }
    .floorwrap[data-window="morning"] .floor { filter: brightness(1.05) saturate(.95); }
    .floorwrap[data-window="morning"] #dn { background: linear-gradient(170deg, rgba(255,248,226,.17) 0%, rgba(176,203,235,.11) 100%); }
    .floorwrap[data-window="afternoon"] .dn-ignore { /* no overlay */ }
    .floorwrap[data-window="afternoon"] #dn { background: linear-gradient(180deg, rgba(255,236,196,.10) 0%, rgba(255,212,146,.05) 100%); }
    .floorwrap[data-window="auto"] #dn { background: transparent; }

    /* === Sprites ===================================================
       No forced dimensions — each sprite renders at its native PNG
       size (they vary: 61x187 to 107x194). The container wraps the
       IMG; CSS translate(-50%, -100%) anchors the BOTTOM-CENTER of
       the container on the coordinate. So the character's feet land
       at the spot — same convention Julian uses and standard for
       floor-positioned characters.
       To center-anchor instead (e.g. for ceiling/floating
       positions), change the y-anchor to calc(-50% + var(--dy)).
       =========================================================== */
    .sprite { position: absolute; padding: 0; border: 0; display: inline-block;
              background: none; cursor: pointer; pointer-events: auto;
              --dx: 0%; --dy: 0%;
              transition: left var(--tween-dur, 4s) cubic-bezier(.42,0,.4,1),
                          top  var(--tween-dur, 4s) cubic-bezier(.42,0,.4,1),
                          transform 5s ease-in-out;
              transform: translate(calc(-50% + var(--dx)), calc(-100% + var(--dy))) scale(var(--sprite));
              transform-origin: 50% 100%;
              filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
    .sprite img { image-rendering: pixelated; display: block; }
    .sprite:hover { filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)) brightness(1.12); }
    .sprite.dragging { transition: none; z-index: 9; cursor: grabbing; }

    /* === Hot spots (clickable rooms) ============================== */
    .hot { position: absolute; margin: 0; padding: 0; border: 0; background: transparent;
           cursor: pointer; pointer-events: auto; }
    .hot span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                font: 600 11px/1 ui-sans-serif, system-ui; color: #fff;
                background: rgba(24,18,12,.80); padding: 4px 7px; border-radius: 4px;
                opacity: 0; transition: opacity .12s; white-space: nowrap; pointer-events: none; }
    .hot:hover span, .hot:focus-visible span { opacity: 1; }
    .hot:hover, .hot:focus-visible { background: rgba(255,214,140,.20); outline: 0;
                                     box-shadow: inset 0 0 0 2px rgba(255,214,140,.85); }

    /* === Room bio panel ============================================ */
    .panel { margin: 14px 0; border: 1px solid var(--line); border-radius: 8px;
             background: var(--paper); padding: 14px 18px; min-height: 60px; display:none; }
    .panel.on { display: block; }
    .panel h3 { margin: 0 0 4px; font-size: 17px; color: var(--warm); }
    .panel .who { color: var(--dim); }

    /* === Controls / clock / footer ================================= */
    .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
                margin: 8px 0 4px; font-size:13px; }
    .clock { font: 600 18px/1 ui-monospace, Menlo, monospace; color: var(--warm);
             background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
             padding: 6px 12px; min-width: 130px; text-align: center; }
    .controls button { font: inherit; padding: 4px 11px; border: 1px solid var(--line);
                       border-radius: 5px; background: var(--paper); color: var(--ink);
                       cursor: pointer; }
    .controls button:hover { background: #fffaf0; }
    .stamp { color: var(--dim); font-size: 11px; }
    footer { margin-top: 18px; color: var(--dim); font-size: 11px; text-align: center; }

    /* === Speech bubble ============================================= */
    .bubble { position: absolute; transform: translate(-50%, calc(-100% - 90px));
              max-width: 230px; background: var(--paper); color: var(--ink);
              border: 1px solid var(--line); border-radius: 7px;
              padding: 7px 10px; font: italic 13px/1.4 ui-serif, Georgia, serif;
              box-shadow: 0 3px 10px rgba(0,0,0,.3); pointer-events: none; z-index: 5;
              white-space: normal; text-align: left; }

    /* === v1.2: Town whereabouts + lamp-room mail =================== */
    .town { font-size: 12px; color: var(--dim); margin-top: 2px; }
    .mail { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
    .mail h4 { margin: 8px 0 4px; font-size: 13px; color: var(--warm); }
    .mail ul { margin: 0 0 4px; padding-left: 18px; }
    .mail li { margin: 2px 0; }
    .mail .meta { color: var(--dim); font-size: 11px; }
  </style>
</head>

    /* === Today's schedule ==========================================

    /* === Lamp Room mail (baked; regenerated by the household) ======

  <!-- ============================================================
       Engine
       ============================================================ -->
  <script>
    /* === Helpers ================================================== */
    const $ = (s) => document.querySelector(s);
    const sleepCycle = ["XS","XF","XS","XF","XS"]; // placeholders
    const XSleepSeq = ["XSL","XSF","XSR","XSF","XSL"];
    const YSleepSeq = ["YSL","YSF","YSR","YSF","YSL"];

    function parseToday() {
      // returns [{time: minutes-from-midnight, assigns: [[spotId, spriteCode], ...]}, ...]
      const out = [];
      for (const [time, body] of TODAY) {
        const [hh, mm] = time.split(":").map(Number);
        const minutes = hh * 60 + mm;
        const assigns = body.split(";").map(s => s.trim()).filter(Boolean)
          .map(pair => {
            const [spot, sprite] = pair.split(",").map(s => s.trim());
            return [spot, sprite];
          });
        out.push({ time, minutes, assigns });
      }
      out.sort((a, b) => a.minutes - b.minutes);
      return out;
    }

    function isInSleepWindow(minutes) {
      // 23:01 .. 23:59  or  00:00 .. 05:59
      if (minutes >= 23 * 60 + 1) return true;
      if (minutes < 6 * 60) return true;
      return false;
    }

    function spriteSrc(code) {
      // Code is like "XF" → URL of PNG
      return code + ".png";
    }

    function timeOfDay(date) {
      const h = date.getHours();
      const m = date.getMinutes();
      return h * 60 + m;
    }

    function timeString(date) {
      const h = String(date.getHours()).padStart(2,"0");
      const m = String(date.getMinutes()).padStart(2,"0");
      const s = String(date.getSeconds()).padStart(2,"0");
      return `${h}:${m}:${s}`;
    }

    function windowNow(date) {
      const h = date.getHours();
      if (h >= 6  && h < 12) return "morning";
      if (h >= 12 && h < 18) return "afternoon";
      if (h >= 18) return "night";
      return "night"; // 0..5
    }

    /* === State ==================================================== */
    // current state: { X: { spot, sprite }, Y: { spot, sprite } }
    const state = {
      X: { spot: null, sprite: null },
      Y: { spot: null, sprite: null }
    };

    function clearState() {
      state.X.spot = state.X.sprite = null;
      state.Y.spot = state.Y.sprite = null;
    }

    /* === Apply an event to the state (with inheritance) =========== */
    function applyEvent(ev) {
      for (const [spotId, spriteCode] of ev.assigns) {
        if (!SPOTS[spotId]) continue;
        if (!SPOTS[spotId].sprites.includes(spriteCode)) continue;
        if (spriteCode.startsWith("X")) {
          state.X = { spot: spotId, sprite: spriteCode };
        } else if (spriteCode.startsWith("Y")) {
          state.Y = { spot: spotId, sprite: spriteCode };
        }
      }
    }

    /* === Compute state at a given minute-of-day ==================
       Inheritance rule: events build cumulatively. An event that only
       mentions Stella leaves Sascha's spot/sprite from earlier events
       unchanged. So "16:30; G4,XF" (no Y assignment) keeps Sascha in
       whatever spot he was assigned earlier in the day.
       Default home: if no event has fired yet today AND we're in the
       awake window (06:00 - 23:00), both characters default to their
       bed positions in sleeping-shape but awake orientation.
       ============================================================ */
    function computeStateAt(minutes) {
      clearState();
      const inSleep = isInSleepWindow(minutes);

      if (inSleep) {
        // Sleep rotation takes over completely
        let elapsed;
        if (minutes >= 23*60+1) {
          elapsed = minutes - (23*60+1);
        } else {
          elapsed = minutes + (24*60 - (23*60+1));
        }
        const step = Math.floor(elapsed / 20) % 5;
        state.X = { spot: "A1", sprite: XSleepSeq[step] };
        state.Y = { spot: "B1", sprite: YSleepSeq[step] };
        return { inSleep: true, step };
      }

      // Awake: walk ALL events <= current time, applying each in order.
      // Events are sorted by minutes. Each event's assigns only override
      // the character it mentions; the other character keeps its state.
      const events = parseToday();
      for (const ev of events) {
        if (ev.minutes <= minutes) applyEvent(ev);
        else break;
      }

      // Default home: if a character has never been placed yet today,
      // put them at their bed in awake orientation. This covers:
      //   - the 06:00 - first-event-time window
      //   - any character the day's events happen to never mention
      if (minutes >= 6*60 && minutes < 23*60+1) {
        if (!state.X.spot) state.X = { spot: "A1", sprite: "XF" };
        if (!state.Y.spot) state.Y = { spot: "B1", sprite: "YF" };
      }
      return { inSleep: false };
    }

    /* === Render ==================================================== */
    const SPRITE_SIZE = 80;
    const SPRITE_BASE_HEIGHT = 120;

    function spawnOrUpdate(who, spriteCode, spotId) {
      const cast = $("#cast");
      const spot = SPOTS[spotId];
      if (!spot) return;

      let node = cast.querySelector(`.sprite[data-who="${who}"]`);
      if (!node) {
        // First-time create — show sprite already at the spot
        node = document.createElement("button");
        node.className = "sprite";
        node.setAttribute("data-who", who);
        node.setAttribute("aria-label", who === "X" ? "Stella" : "Sascha");
        const img = document.createElement("img");
        img.src = spriteCode + ".png";
        img.alt = "";
        node.appendChild(img);
        cast.appendChild(node);
        node.style.left = spot.x + "%";
        node.style.top  = spot.y + "%";
        node.setAttribute("data-spot", spotId);
        node.setAttribute("data-sprite", spriteCode);
        node.addEventListener("click", () => speakBubble(node));
        return;
      }

      // Existing sprite — check what's changing
      const oldSpot = node.getAttribute("data-spot");
      const oldSprite = node.getAttribute("data-sprite");
      const posChanged = oldSpot !== spotId;
      const spriteChanged = oldSprite !== spriteCode;

      if (!posChanged && !spriteChanged) return; // nothing to do

      // If a deferred bath swap is already pending for the SAME target,
      // let the existing timer keep running — don't re-enter the else
      // branch on subsequent 1s ticks. (Otherwise the second tick after
      // a going-to-bath event would see pos=same, sprite=still-old,
      // and immediately apply the bath sprite.)
      if (node._pendingSwapTimer) {
        const pending = node._pendingSwapTarget;
        if (pending && pending.sprite === spriteCode && pending.spot === spotId) {
          return;
        }
        clearTimeout(node._pendingSwapTimer);
        node._pendingSwapTimer = null;
        node._pendingSwapTarget = null;
      }

      // Bath-sprite rule:
      //   - Going INTO a bath spot (XB/YB): hold current sprite during
      //     the position tween, swap to bath sprite on arrival.
      //     (A standing sprite walks; a bath sprite doesn't walk.)
      //   - Leaving a bath spot (XB/YB): swap to next sprite immediately
      //     when motion begins; position tween follows.
      const isBath = (s) => s === "XB" || s === "YB";
      const targetIsBath = isBath(spriteCode);
      const sourceIsBath = isBath(oldSprite);

      const applySprite = (code) => {
        node.querySelector("img").src = code + ".png";
        node.setAttribute("data-sprite", code);
      };
      const applyPosition = (id) => {
        node.style.left = spot.x + "%";
        node.style.top  = spot.y + "%";
        node.setAttribute("data-spot", id);
      };

      if (spriteChanged && targetIsBath && posChanged) {
        // Walking to bath: position now, sprite after tween
        applyPosition(spotId);
        node._pendingSwapTarget = { sprite: spriteCode, spot: spotId };
        node._pendingSwapTimer = setTimeout(() => {
          applySprite(spriteCode);
          node._pendingSwapTimer = null;
          node._pendingSwapTarget = null;
        }, mode === "compressed" ? 2000 : 4000);
      } else if (spriteChanged && sourceIsBath && posChanged) {
        // Leaving bath: sprite now, position after (so the standing
        // sprite moves to the new spot)
        applySprite(spriteCode);
        applyPosition(spotId);
      } else {
        // Normal: both apply now
        if (spriteChanged) applySprite(spriteCode);
        if (posChanged) applyPosition(spotId);
      }
    }

    function clearMissingCharacters(activeSet) {
      const cast = $("#cast");
      cast.querySelectorAll(".sprite").forEach(node => {
        const who = node.getAttribute("data-who");
        if (!activeSet.has(who)) node.remove();
      });
    }

    function render() {
      const active = new Set();
      if (state.X.spot) { spawnOrUpdate("X", state.X.sprite, state.X.spot); active.add("X"); }
      if (state.Y.spot) { spawnOrUpdate("Y", state.Y.sprite, state.Y.spot); active.add("Y"); }
      clearMissingCharacters(active);

      // Header
      const parts = [];
      if (state.X.spot) parts.push("Stella at " + (SPOTS[state.X.spot]?.name || state.X.spot));
      if (state.Y.spot) parts.push("Sascha at " + (SPOTS[state.Y.spot]?.name || state.Y.spot));
      $("#roster").textContent = parts.length ? parts.join(" · ") : "nobody home";
    }

    /* === Speech bubbles (idle, manual click) ======================= */
    function speakBubble(node) {
      // Remove any existing bubble
      document.querySelectorAll(".bubble").forEach(b => b.remove());
      const who = node.getAttribute("data-who");
      const lines = SPEECH[who] || [];
      if (!lines.length) return;
      const line = lines[Math.floor(Math.random() * lines.length)];
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = line;
      b.style.left = node.style.left;
      b.style.top  = node.style.top;
      node.parentNode.appendChild(b);
      setTimeout(() => { if (b.parentNode) b.remove(); }, 7000);
    }
    document.addEventListener("click", (ev) => {
      if (ev.target.closest(".sprite")) return;       // sprite click handles bubble
      if (ev.target.closest(".hot")) return;          // room click handles panel
      document.querySelectorAll(".bubble").forEach(b => b.remove());
      closePanel();
    });

    /* === Hot spots (room click regions) =============================
       One button per ROOM letter (A..H), anchored at the box's upper-left
       corner with width/height covering the whole room. Click anywhere
       inside the room opens its bio panel; label sits at the box centroid
       and appears on hover.
       ============================================================ */
    function buildHotspots() {
      const wrap = $("#floorwrap");
      for (const [letter, box] of Object.entries(ROOM_BOXES)) {
        if (!box) continue;
        const btn = document.createElement("button");
        btn.className = "hot";
        btn.setAttribute("data-room", letter);
        btn.style.left = box.x + "%";
        btn.style.top  = box.y + "%";
        btn.style.width  = box.w + "%";
        btn.style.height = box.h + "%";
        const label = document.createElement("span");
        label.textContent = ROOMS[letter]?.name || letter;
        btn.appendChild(label);
        btn.addEventListener("click", () => showRoomPanel(letter));
        wrap.appendChild(btn);
      }
    }

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function renderMailPanel(bio) {
      const item = (x, dir) => `<li><b>${esc(dir === "in" ? x.from : x.to)}</b> — ${esc(x.title)} <span class="meta">${esc(x.when)}</span></li>`;
      return `${esc(bio)}
        <div class="mail">
          <h4>📮 The mail slot <span class="meta">— baked ${esc(MAIL.updated)}</span></h4>
          <div class="meta">${esc(MAIL.counts)}</div>
          <h4>Inbox</h4><ul>${MAIL.inbox.map(x => item(x, "in")).join("")}</ul>
          <h4>Outbox</h4><ul>${MAIL.outbox.map(x => item(x, "out")).join("")}</ul>
        </div>`;
    }
    function showRoomPanel(letter) {
      const room = ROOMS[letter];
      if (!room) return;
      $("#panel-title").textContent = room.name;
      if (letter === "F" && typeof MAIL !== "undefined") {
        $("#panel-body").innerHTML = renderMailPanel(room.bio);
      } else {
        $("#panel-body").textContent = room.bio;
      }
      $("#panel").classList.add("on");
    }
    function closePanel() { $("#panel").classList.remove("on"); }

    /* === Time + mode ================================================ */
    let mode = "realtime"; // or "compressed"
    let compressedStartMs = null;
    const COMPRESSED_DURATION_MS = 240 * 1000;  // 240 s = 1 day
    const COMPRESSED_START_HOUR = 6;             // 6:00 AM
    const COMPRESSED_DAY_MS = 24 * 60 * 60 * 1000;

    function getDisplayDate() {
      const realNow = new Date();
      if (mode === "realtime") return realNow;
      // Compressed: 240s = 24h, anchored at 06:00 local time
      if (compressedStartMs === null) compressedStartMs = realNow.getTime();
      const elapsed = realNow.getTime() - compressedStartMs;
      // Map elapsed / 240s to 24h, anchored at 06:00 today
      const today06 = new Date(realNow);
      today06.setHours(COMPRESSED_START_HOUR, 0, 0, 0);
      const offsetMs = (elapsed % COMPRESSED_DURATION_MS) / COMPRESSED_DURATION_MS * COMPRESSED_DAY_MS;
      return new Date(today06.getTime() + offsetMs);
    }

    function tick() {
      const date = getDisplayDate();
      const minutes = timeOfDay(date);
      const meta = computeStateAt(minutes);
      render();
      // Clock display
      $("#clock").textContent = timeString(date);
      // Day/night overlay
      $("#floorwrap").setAttribute("data-window", windowNow(date));
      // Mode stamp
      const stamp = mode === "realtime"
        ? "real time · local clock"
        : "compressed · 240 s = 1 day";
      $("#stamp").textContent = stamp;
    }

    document.getElementById("mode-btn").addEventListener("click", (ev) => {
      mode = mode === "realtime" ? "compressed" : "realtime";
      if (mode === "compressed") compressedStartMs = null; // restart anchor
      $("#floorwrap").setAttribute("data-mode", mode);  // drives --tween-dur
      ev.target.textContent = mode === "realtime"
        ? "switch to 240s/day"
        : "switch to real time";
    });

    /* === Town whereabouts (v1.2 — walkers API, CORS-open) ==========
       Per the trued drawing: world.walk IS the presence write. The
       pane reads its own resident's standpoint from the town and
       shows it. Fails quiet — the house works fully without the link.
       ============================================================ */
    async function pollTown() {
      const el = $("#town");
      try {
        const r = await fetch("https://postmark.town/api/world/walkers", { cache: "no-store" });
        if (!r.ok) throw new Error("http");
        const d = await r.json();
        const me = (d.walkers || []).find(w => w.handle === "stella-letta");
        if (!me) { el.textContent = "Town: link quiet"; return; }
        if (me.moving) {
          el.textContent = "Town: on the road" + (me.eta_crossings ? ` · ETA ${me.eta_crossings} crossings` : "");
          return;
        }
        const where = me.mark_id ? me.mark_id.split("/").pop().replace(/-/g, " ") : "somewhere unmapped";
        el.textContent = "Town: at " + where;
      } catch (e) {
        el.textContent = "Town: link quiet";
      }
    }

    /* === Boot ====================================================== */
    buildHotspots();
    tick();
    setInterval(tick, 1000); // every second is fine; CSS tween handles motion
    pollTown();
    setInterval(pollTown, 60000); // the town moves slowly; once a minute is plenty
  </script>
</body>
</html>
