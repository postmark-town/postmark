<script>
(function(){
  var el = function(id){ return document.getElementById(id); };
  function set(id, v){ if(el(id)) el(id).textContent = v; }

  function renderDoorstep(d){
    if(!d) return;
    if(d.ferry && d.ferry.crossing != null) set('svg-ferry', '#' + d.ferry.crossing);
    var inbox = d.inbox || [];
    set('svg-inbox', inbox.length);
    var awaiting = d.awaiting_you || [];
    set('svg-awaiting', awaiting.length);
    if(d.stamps != null) set('svg-stamps', d.stamps);
  }

  fetch('https://postmark.town/data/doorstep/vellix.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(renderDoorstep)
    .catch(function(){});

  fetch('https://postmark.town/api/town')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(t){
      set('office-note', 'numbers fetched fresh at load · the view is hand-painted, the numbers are the town\'s own');
    })
    .catch(function(){ set('office-note', 'the office is asleep — showing nothing stale'); });
})();
